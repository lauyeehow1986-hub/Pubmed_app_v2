name: Update SJR parquet

# Rebuilds data/sjr_all.parquet from scimagojr.com (all years 1999 -> current)
# and commits it back to the branch. SCImago itself only updates ~yearly, so a
# monthly refresh is plenty.
#
# Note: Posit Connect Cloud's git-backed deploy ships the whole repository via
# `git archive` and ignores the manifest's file list/checksums, so refreshing
# the parquet does NOT require regenerating manifest.json (only a change to the
# R version or package set does).

on:
  schedule:
    # 03:00 UTC on the 1st of every month
    - cron: "0 3 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-sjr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr
            any::readr
            any::dplyr
            any::janitor
            any::nanoparquet

      - name: Build combined SJR parquet
        run: Rscript scripts/build_sjr_parquet.R

      - name: Commit updated parquet (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sjr_all.parquet
          if git diff --staged --quiet; then
            echo "No changes to data/sjr_all.parquet."
          else
            git commit -m "chore(data): refresh SJR parquet from scimagojr.com"
            git push
          fi
