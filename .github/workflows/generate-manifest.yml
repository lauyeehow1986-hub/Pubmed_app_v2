name: Generate Connect manifest

# Generates manifest.json for Posit Connect Cloud by installing the app's R
# package dependencies and running rsconnect::writeManifest(). Run this whenever
# app.R's package dependencies change (and once, manually, to seed the file).
#
# Run AFTER the SJR parquet has been built so the manifest includes
# data/sjr_all.parquet.

on:
  workflow_dispatch: {}
  push:
    branches:
      - "**"
    paths:
      - "app.R"

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install app + rsconnect dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shiny
            any::shinydashboard
            any::xml2
            any::httr
            any::jsonlite
            any::dplyr
            any::tidyr
            any::stringr
            any::DT
            any::lubridate
            any::duckdb
            any::DBI
            any::rsconnect

      - name: Write manifest.json
        run: Rscript -e 'rsconnect::writeManifest(appDir = ".", appPrimaryDoc = "app.R")'

      - name: Commit manifest (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --staged --quiet; then
            echo "No changes to manifest.json."
          else
            git commit -m "chore: regenerate Connect manifest"
            git push
          fi
