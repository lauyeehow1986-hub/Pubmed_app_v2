name: CI

# Lightweight R checks. The parse smoke test is the gate (fails the build on any
# syntax error in app.R or the appfun/ modules); lint runs as advisory output so
# style issues are visible without blocking. Neither step needs duckdb -- parse()
# and lintr do static analysis only -- so CI stays fast.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  parse-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install lintr
        # Pass repos explicitly: plain Rscript doesn't auto-use the runner's
        # RSPM mirror, so install.packages() would otherwise fail with
        # "trying to use CRAN without setting a mirror". RSPM gives fast
        # Linux binaries; fall back to CRAN cloud if RSPM isn't set.
        run: install.packages("lintr", repos = Sys.getenv("RSPM", unset = "https://cloud.r-project.org"))
        shell: Rscript {0}

      - name: Parse smoke test (blocking)
        run: Rscript tests/parse_check.R

      - name: Lint (advisory)
        run: |
          lints <- lintr::lint_dir(".")
          print(lints)
          cat(sprintf("\n%d lint(s) found (advisory; does not fail the build).\n", length(lints)))
        shell: Rscript {0}
